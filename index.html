<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2930">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bacher Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Bacher Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--alarm:#C62828;
  --bg:#EDEFEE;--panel:#FFFFFF;--soft:#F4F6F5;--ink:#1B2328;--muted:#58646C;--line:#D3D9D7;
  --nav:#1D2930;--nav-ink:#DDE5E6;--nav-mute:#93A3AA;
  --hi:#F2B705;--hi-2:#D29F00;--on-hi:#1B2328;
  --ok:#2A7248;--ok-bg:#E1F0E6;--warn:#8F5500;--warn-bg:#FBEED3;--info:#25547A;--info-bg:#E0EBF4;--mute-bg:#E6E9E9;--bad:#A8231B;--bad-bg:#F8E1DF;
  --focus:#2B6CB0;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171A;--panel:#1A2226;--soft:#161D20;--ink:#E6ECEC;--muted:#9AA8AE;--line:#2B363C;
    --nav:#0C1113;--nav-ink:#D5DEE0;--nav-mute:#7F9097;
    --ok:#7FCB9C;--ok-bg:#1D3326;--warn:#F0C06A;--warn-bg:#3A2D12;--info:#8DBDE3;--info-bg:#18293A;--mute-bg:#252E33;--bad:#F08A82;--bad-bg:#3B1E1C;--focus:#7FB2E8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171A;--panel:#1A2226;--soft:#161D20;--ink:#E6ECEC;--muted:#9AA8AE;--line:#2B363C;
  --nav:#0C1113;--nav-ink:#D5DEE0;--nav-mute:#7F9097;
  --ok:#7FCB9C;--ok-bg:#1D3326;--warn:#F0C06A;--warn-bg:#3A2D12;--info:#8DBDE3;--info-bg:#18293A;--mute-bg:#252E33;--bad:#F08A82;--bad-bg:#3B1E1C;--focus:#7FB2E8;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
@media (display-mode:standalone){.side{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}.topbar{padding-top:calc(10px + env(safe-area-inset-top,0px))}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}

.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 24px;font:700 1.55rem/1 var(--cond);color:#fff;letter-spacing:.01em}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--hi);color:var(--on-hi);display:grid;place-items:center;font-size:1.15rem}
.brand small{display:block;font:500 .78rem var(--body);color:var(--nav-mute);letter-spacing:0;margin-top:3px}
.navlinks{display:flex;flex-direction:column;gap:2px}
.navlink{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-weight:500}
.navlink:hover{background:rgba(255,255,255,.05)}
.navlink[aria-current="page"]{background:rgba(255,255,255,.09);color:#fff;box-shadow:inset 3px 0 0 var(--hi)}
.navfoot{margin-top:auto;display:grid;gap:6px;font-size:.85rem;color:var(--nav-mute);padding:0 6px}
.navfoot select,.topbar select{font:500 .9rem var(--body);padding:7px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;width:100%}
.navfoot select option,.topbar select option{color:#1B2328;background:#fff}
.topbar{display:none;background:var(--nav);color:#fff;padding:10px 14px;align-items:center;justify-content:space-between;gap:12px}
.topbar .brand{padding:0;font-size:1.3rem}
.topbar select{width:auto;max-width:55%}

main{padding:28px clamp(16px,3vw,40px) 64px;width:100%;max-width:1220px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:20px}
h1{font:700 2.2rem/1.05 var(--cond);margin:0;letter-spacing:.005em}
h2{font:600 1.3rem/1.15 var(--cond);margin:0 0 12px}
h3{font:600 1.05rem/1.2 var(--body);margin:0 0 6px}
.sub{color:var(--muted);margin:4px 0 0}
.back{display:inline-block;margin-bottom:10px;color:var(--muted);text-decoration:none;font-weight:500}
.back:hover{color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.grid2>*,.stack>*,.panel,.tablewrap{min-width:0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 16px;align-items:start}
.bgrid>*{min-width:0}
.tablewrap{max-width:100%}
td.wrap small,td small{white-space:normal}
.stack{display:grid;gap:16px}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:18px;font-weight:500;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--info)}
.empty{color:var(--muted);margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{font:600 .95rem var(--body);min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--hi);border-color:var(--hi-2);color:var(--on-hi)}
.btn.primary:hover{background:var(--hi-2)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:32px;padding:0 10px;font-size:.85rem}
.btn.big{min-height:56px;font-size:1.05rem;justify-content:flex-start}
.linkbtn{background:none;border:0;padding:0;color:var(--info);font:inherit;cursor:pointer;text-decoration:underline}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font:500 .9rem var(--body);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{min-height:38px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;min-width:220px}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.Active,.pill.Accepted{background:var(--ok-bg);color:var(--ok)}
.pill.Upcoming,.pill.Sent{background:var(--info-bg);color:var(--info)}
.pill.On-hold,.pill.Draft{background:var(--warn-bg);color:var(--warn)}
.pill.Overdue{background:var(--bad-bg);color:var(--bad)}
.pill.Complete,.pill.Declined{background:var(--mute-bg);color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.85rem;background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--soft);border-bottom:0;border-top:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--soft)}
td.wrap{white-space:normal;min-width:200px}
td small,li small{display:block;color:var(--muted);font-size:.85rem}

.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.list li:last-child{border-bottom:0}
.list li.today{box-shadow:inset 3px 0 0 var(--hi);padding-left:10px}
.jobdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--jc);margin-right:8px;vertical-align:baseline}

dl.details{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
dl.details dt{color:var(--muted)}
dl.details dd{margin:0;white-space:pre-wrap}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.fig span{display:block;color:var(--muted);font-size:.85rem}
.fig b{font:700 1.5rem/1.1 var(--cond);font-variant-numeric:tabular-nums}

/* Timeclock */
.clock{background:var(--nav);color:#fff;border-radius:14px;padding:22px;display:grid;gap:14px;align-content:start}
.clock .state{color:var(--nav-mute);font-weight:500;display:flex;align-items:center;gap:8px}
.clock .big{font:700 3.4rem/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .job{font:600 1.4rem/1.15 var(--cond)}
.clock label{color:var(--nav-mute);font-weight:500;font-size:.9rem}
.clock select{background:#fff;color:#1B2328;border:0}
.clock .wk{color:var(--nav-mute);font-size:.9rem}
.clockbtn{min-height:70px;border-radius:12px;border:0;cursor:pointer;background:var(--hi);color:var(--on-hi);font:700 1.7rem var(--cond);width:100%}
.clockbtn:hover{background:var(--hi-2)}
.clockbtn.out{background:#fff;color:#1D2930}
.clockbtn.out:hover{background:#E4E9EA}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.actbtn{min-height:52px;border-radius:10px;border:2px solid rgba(255,255,255,.22);background:transparent;color:#fff;font:600 1.15rem var(--cond);cursor:pointer}
.actbtn[aria-pressed="true"]{background:#fff;color:#1D2930;border-color:#fff}
.jpick{display:grid;gap:8px}
.jpick-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;width:100%;padding:10px 14px;border-radius:10px;border:0;background:#fff;color:#1B2328;font:600 1.05rem var(--cond);text-align:left;cursor:pointer}
.jpick-btn .muted{font:500 .9rem/1.25 var(--sans);color:#5A6A72}
.jpick-btn .chev{opacity:.45;font-size:1.2rem}
.clock .jpick-btn{background:#fff;color:#1B2328}
.jpick-search{min-height:48px;font-size:1.05rem;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.jpick-sec{font:700 .8rem/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.jpick-list{display:grid;gap:6px;max-height:min(52vh,420px);overflow:auto;-webkit-overflow-scrolling:touch}
.jpick-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:600 1.05rem var(--cond);text-align:left;cursor:pointer;width:100%}
.jpick-item:hover,.jpick-item:focus{border-color:var(--ink);outline:none}
.jpick-item[aria-pressed="true"]{border-color:var(--hi);box-shadow:inset 0 0 0 2px var(--hi)}
.jpick-item small{display:block;font:500 .88rem/1.25 var(--sans);color:var(--muted);font-weight:500}
.jpick-item .dist{flex:0 0 auto;font:600 .95rem var(--cond);color:var(--muted)}
.jpick-empty{padding:12px;color:var(--muted);text-align:center}

.notebox{background:rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.onDarkLink{color:var(--hi)}
.flag{color:var(--warn);font-weight:600}
tr.flagged td{background:var(--warn-bg)}
.list li.flagged{background:var(--warn-bg);padding-left:10px;padding-right:10px;border-radius:6px}
.eqgrid{display:grid;gap:6px}
.eqrow{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.eqrow input[type=number]{min-height:36px;padding:5px 8px}
.adminbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.adminbox summary{cursor:pointer;font-weight:600}
.acts.light{grid-template-columns:1fr 1fr}
.actlbl{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:2px solid var(--line);border-radius:10px;font:600 1.1rem var(--cond);cursor:pointer}
.actlbl input{width:auto;min-height:0}
.actlbl:has(input:checked){border-color:var(--ink);background:var(--soft)}
.checkrow{grid-template-columns:1fr auto !important}
.navlink.more{display:none;background:none;border:0;font:inherit;cursor:pointer}
.loadbox{border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:14px;display:grid;gap:10px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{margin:0;position:relative}
.thumb img{width:120px;height:90px;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block}
.thumb .btn{position:absolute;top:4px;right:4px;min-height:26px;padding:0 7px;background:var(--panel)}
.invdoc{max-width:820px}
.invhead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.invco{font:700 1.6rem var(--cond)}
.invtitle{font:700 1.9rem var(--cond)}
.invtable{width:100%}
.invtable th,.invtable td{white-space:normal}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%;border:0!important;padding:0!important}.noprint{display:none!important}}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.loginbox{width:min(420px,100%)}
.btn.onDark{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.live{width:10px;height:10px;border-radius:50%;background:#5BD08A;box-shadow:0 0 0 0 rgba(91,208,138,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,208,138,.55)}70%{box-shadow:0 0 0 9px rgba(91,208,138,0)}100%{box-shadow:0 0 0 0 rgba(91,208,138,0)}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}

/* Schedule */
.sched td,.sched th{padding:5px;min-width:118px}
.sched th:first-child,.sched td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:160px;padding:10px 12px}
.sched th:first-child{background:var(--soft)}
.sched th.today{color:var(--ink);box-shadow:inset 0 -3px 0 var(--hi)}
.cellbtn{width:100%;min-height:46px;border-radius:6px;border:1px dashed var(--line);background:transparent;cursor:pointer;text-align:left;padding:5px 8px;font:500 .85rem/1.2 var(--body);color:var(--muted);white-space:normal}
.cellbtn:hover{border-color:var(--muted)}
.cellbtn.has{border:0;border-left:4px solid var(--jc);background:var(--soft);color:var(--ink)}
.cellbtn.multi{border-left:0;padding:4px 6px}
.cjob{display:block}
.cellbtn.multi .cjob{border-left:4px solid var(--jc);padding-left:6px;margin:2px 0}
.tasks{display:grid;gap:4px;margin-top:6px}
.taskchip{text-align:left;border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:6px;padding:5px 8px;font:500 .85rem/1.25 var(--body);cursor:pointer;white-space:normal}
.taskchip.done{border-color:var(--line);background:var(--soft);color:var(--muted);text-decoration:line-through}
.fsched td{min-width:150px}
.fsched td.todaycol{background:var(--soft)}
.fjob{display:block;text-decoration:none;border-left:4px solid var(--jc);background:var(--panel);border-radius:6px;padding:6px 8px;margin-bottom:6px;box-shadow:inset 0 0 0 1px var(--line);white-space:normal}
.fjob:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.fjob small{display:block;color:var(--muted);font-size:.8rem}
.cellbtn.off{border-style:solid;background:var(--mute-bg);color:var(--muted)}
.dayblock{padding:12px 0;border-bottom:1px solid var(--line)}
.dayblock:last-child{border-bottom:0}
.dayblock.today h3{box-shadow:inset 3px 0 0 var(--hi);padding-left:10px}
.crewline{margin:6px 0 0;padding-left:12px;border-left:4px solid var(--jc)}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:16px}
.sync{margin-left:auto;font:600 .85rem var(--body);padding:4px 10px;border-radius:999px;background:var(--ok-bg,#e6f4ea);color:var(--ok,#1b7f3b)}
.sync.off{background:var(--warn-bg,#fff3d6);color:#8a5a00}
.cpick{position:relative}
.cpick-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:280px;overflow:auto;margin-top:4px}
.cpick-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--soft);padding:8px 12px;font:inherit;cursor:pointer;color:inherit}
.cpick-item:hover,.cpick-item:focus{background:var(--mute-bg)}
.cpick-item small{display:block;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:16px}
.stat{display:block;text-align:left;font:inherit;cursor:pointer;width:100%;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font:700 2rem/1 var(--cond)}.stat span{display:block;font-weight:600;margin-top:4px}.stat small{display:block;color:var(--muted);margin-top:2px}
.stat:hover,.stat:focus{border-color:var(--ink)}
.homegrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:900px){.homegrid{grid-template-columns:1fr}}
.jobcard{border:1px solid var(--line);border-left:5px solid var(--jc,var(--line));border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.list.compact li{padding:6px 0}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.quick .btn{min-height:48px}
.big-check{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-weight:600}
.big-check input{width:22px;height:22px}
label.chip:has(input:checked){background:var(--ink);color:var(--panel);border-color:var(--ink)}
tr.fleetflag td{background:#fff8e1}tr.fleetflag.bad td{background:#fdecea}tr.fleetflag td:first-child{box-shadow:inset 4px 0 0 #e0a800}tr.fleetflag.bad td:first-child{box-shadow:inset 4px 0 0 #c0392b}
@media (prefers-color-scheme:dark){tr.fleetflag td{background:#3a3214}tr.fleetflag.bad td{background:#3d1d1a}}
.annwarn{background:#c0392b;color:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:1rem}.annwarn b{font-size:1.15rem;letter-spacing:.02em}
.cellbtn{all:unset;cursor:pointer;display:block;width:100%;padding:4px 2px;border-radius:6px;text-align:inherit;box-sizing:border-box}.cellbtn:hover,.cellbtn:focus-visible{background:var(--soft);outline:2px solid var(--line)}td.num .cellbtn{text-align:right}
.s1col{display:inline-block;vertical-align:top;width:48%;min-width:220px;margin-right:2%}.s1col.major b{color:#c0392b}.s1table td{font-size:.92rem}
.s1ref{font-weight:700;text-decoration:none;border-bottom:1px dotted}.unver{color:#8a5a00}.s1noteblk{border-top:1px solid var(--line);padding-top:6px;margin-top:8px}.s1lim h5{margin:8px 0 4px}

  if((t.act||'')==='drive'&&t.floatEq){if(!t.floatTo){toast('Pick where you\'re taking the machine.');return}t={...t,jobId:floatBillJob(t.floatEq,t.floatTo),extraId:S.jobs[t.floatTo]?t.extraId:''}}
  const act=t.act||'labour',jobId=act==='shop'||act==='office'?'':act==='yard'?(t.sub===COLLECT&&t.jobId&&S.jobs[t.jobId]?t.jobId:'loc:yard'):act==='pit'?'loc:'+(t.pit||'mcclintock'):(t.jobId||''),equipId=act==='yard'||act==='office'?'':(t.equipId||'');
  if(act==='operate'&&!equipId){toast('Pick the machine you\'re operating.');return}
  if(act==='drive'&&!equipId){toast('Pick the truck you\'re driving.');return}
  if(act!=='travel'&&act!=='shop'&&act!=='yard'&&act!=='pit'&&!(act==='drive'&&t.floatEq)&&!jobId){toast('Pick a job or location.');return}
  if(equipId&&!isGeneric(equipId)&&unitDown(equipId))toast(`Equipment Out Of Service: ${equipName(equipId)}`);
  if(act==='drive'&&t.floatEq&&t.floatEq===equipId){toast('The machine being floated can\'t be the truck you\'re driving.');return}
  if(act==='yard'&&t.sub===COLLECT&&!S.jobs[jobId]){toast('Pick which job the materials are for.');return}
  if(act!=='travel'&&isCustomerJob(jobId))await attributeTravelSegments(pid,{type:'toJob',jobId});
  else if(act==='shop'||act==='office'||act==='yard'||act==='pit')await attributeTravelSegments(pid,{type:'shop'});
  const loc=await getLoc();const now=Date.now(),wk=weekKey(new Date(now));
  if((act==='operate'||act==='landscape')&&equipId&&jobId&&unitLocation(equipId).loc!==jobId)await put('moves',newId(),{equipId,at:now,to:jobId,by:pid,note:'Clocked in on it here',created:now});const rec={in:now,out:null,act,jobId,equipId,note:'',inLoc:loc,extraId:isQuoted(jobId)&&t.extraId?t.extraId:''};if(act==='travel'){rec.jobId='';rec.travelAuto=true}if(act==='yard')rec.sub=t.sub||'General';if(act==='drive'&&t.trailerId)rec.trailerId=t.trailerId;if(act==='drive'&&t.floatEq){if(!t.floatTo){toast('Pick where you\'re taking the machine.');return}rec.float=floatOf(t.floatEq,t.floatTo)}
  const ok=await patch('time',`${pid}_${wk}`,{personId:pid,week:wk,punches:{[newId()]:rec}});
  if(ok)toast(`Clocked in: ${taskLine(rec)}`);
}
function pickEquipFor(pid,act){if(act==='pit'){const lp=lastPunch(pid,'pit');if(lp&&!UI.clockPitSet)UI.clockPit=String(lp.jobId||'').slice(4)||'mcclintock'}if(act==='yard'&&!UI.clockSubSet)UI.clockSub=isStone(UI.clockFor||myId())?'Stone saw':'General';if(act==='labour'||act==='yard'){UI.clockEquip='';return}const kind=act==='drive'?'truck':act==='travel'?'pickup':(act==='operate'||act==='landscape'||act==='pit')?'machine':null;const ok=id=>id&&S.equip[id]&&!unitDown(id)&&(!kind||kindMatch(S.equip[id],kind));UI.clockEquip=ok(UI.clockEquip)?UI.clockEquip:lastUnitOf(pid,ok,(act==='drive'||act==='travel')?null:act)}
async function clockOut(pid){if(previewBlock())return;UI.clockSubSet=false;UI.clockSub='General';

  if(p.act==='travel'||travelStreak(pid).some(travelNeedsAttr))await attributeTravelSegments(pid,{type:'return'});

}

function draw(){

const PAGE_GROUP={home:'home',jobs:'jobs',job:'jobs',daily:'jobs',docs:'jobs',schedule:'schedule',time:'time',employees:'time',payroll:'time',dispatch:'hauling',pit:'hauling',quotes:'sales',quote:'sales',invoices:'sales',inv:'sales',customers:'sales',cust:'sales',fleet:'shop',unit:'shop',wo:'shop',fuel:'shop',inventory:'shop',stoneshop:'shop',safety:'safety',settings:'settings'};
function navGroups(field){

    {key:'home',label:'Home',pages:[['home','Home']]},
    {key:'time',label:'Time',pages:[['time','TimeClock']]},
    {key:'hauling',label:'Hauling',pages:[...(isDriver(pid)||hasRole(pid,'dispatcher')||isForeman(pid)?[['dispatch','Dispatch']]:[]),...(isPit(pid)||isDriver(pid)?[['pit','Pit']]:[])]},
    {key:'jobs',label:'Jobs',pages:[['jobs','Jobs'],...(isForeman(pid)?[['daily','Daily reports']]:[]),['docs','Documents']]},
    {key:'schedule',label:'Schedule',pages:[['schedule','Schedule']]},
    {key:'shop',label:'Shop',pages:[...(isMechanic(pid)?[['fleet','Fleet'],['wo','Work orders']]:[]),...(isStone(pid)?[['stoneshop','Stone shop']]:[])]},
    {key:'safety',label:'Safety',pages:[['safety','Safety']]}];
  else g=[
    {key:'home',label:'Home',pages:[['home','Home']]},
    {key:'jobs',label:'Jobs',pages:[['jobs','Jobs'],['daily','Daily reports'],['docs','Documents']]},
    {key:'schedule',label:'Schedule',pages:[['schedule','Schedule']]},
    {key:'time',label:'Time',pages:[['time','TimeClock'],['employees','Employees'],...(seeWages()?[['payroll','Payroll']]:[])]},
    {key:'hauling',label:'Hauling',pages:[['dispatch','Dispatch'],['pit','Pit']]},
    {key:'sales',label:'Sales',pages:[['quotes','Quotes'],['invoices','Invoices'],['customers','Customers']]},
    {key:'shop',label:'Shop',pages:[['fleet','Fleet'],['fuel','Fuel'],['inventory','Inventory'],['stoneshop','Stone shop']]},

function navItems(field){return navGroups(field).map(x=>[x.pages[0][0],x.label,x.key])}

function pageHtml(r,field){
  const p=r.page;
  if(!field&&PAGE_PERM[p]&&!can(PAGE_PERM[p]))return `<div class="panel"><p class="empty">You don't have access to this screen. Ask the admin.</p></div>`;
  if(p==='jobs')return jobsList(field);
  if(p==='job')return jobDetail(r.id,field);
  if(p==='quotes'&&!field)return quotesList();
  if(p==='quote'&&!field)return quoteDetail(r.id);
  if(p==='schedule')return field?(myId()?schedField():claimScreen()):schedOffice();
  if(p==='settings'&&!field)return settingsPage();
  if(p==='pit'&&(!field||isPit(myId())||isDriver(myId())))return pitPage(field);
  if(p==='dispatch'&&(!field||isDriver(myId())||hasRole(myId(),'dispatcher')||isForeman(myId())))return field&&!myId()?claimScreen():dispatchPage(field);
  if(p==='payroll'&&seeWages())return payrollPage();
  if(p==='fleet'&&(!field||isMechanic(myId())))return fleetPage();
  if(p==='invoices'&&!field)return invPage();
  if(p==='inv'&&!field)return invDetail(r.id);
  if(p==='customers'&&!field)return custPage();
  if(p==='cust'&&!field)return custDetail(r.id);
  if(p==='fuel'&&!field)return fuelPage();
  if(p==='employees'&&!field)return empPage();
  if(p==='inventory'&&!field)return invtPage();
  if(p==='stoneshop'&&(!field||isStone(myId())))return field&&!myId()?claimScreen():stoneShopPage(field);
  if(p==='wo'&&(!field||isMechanic(myId())))return field&&!myId()?claimScreen():woPage(field);
  if(p==='unit'&&(!field||isMechanic(myId())))return unitPage(r.id);
  if(p==='daily'&&(!field||isForeman(myId())))return dailyPage(field);

function punchRows(list,editable,mine){
  if(!list.length)return '<p class="empty">No time logged this week.</p>';
  const flags=editable?reviewFlags():{};
  const byDay={};list.forEach(p=>{const d=ymd(new Date(p.in));(byDay[d]=byDay[d]||[]).push(p)});
  Object.values(byDay).forEach(l=>l.sort((x,y)=>new Date(y.in)-new Date(x.in)));const gaps=(mine||editable)?dayGaps(list):{};const gapRow=(g,pid)=>`<li class="gaprow" style="border:1px dashed var(--line,#ccc);border-radius:8px;background:transparent;opacity:.85"><div class="muted">${fmtTime(g.a)} to ${fmtTime(g.b)}<small>Not logged (${(hrs(g.b-g.a)).toFixed(1)} h)</small></div><button class="btn small" data-act="addmissed" data-p="${esc(pid)}" data-d="${g.date}" data-in="${hm(g.a)}" data-out="${hm(g.b)}">Add time</button></li>`;
  return Object.keys(byDay).sort().reverse().map(d=>{const tot=byDay[d].reduce((a,p)=>a+punchMs(p),0);
    return `<div class="dayblock"><div class="row"><h3 style="margin:0">${fmtDay(d)}</h3><span class="spacer"></span><b>${fh(hrs(tot))} h</b></div>
    <ul class="list">${byDay[d].map((p,i,arr)=>{const fl=flags[p.id];const gp=(gaps[d]||[]).filter(g=>i>0&&g.b===arr[i-1].in).map(g=>gapRow(g,p.personId)).join('');return `${gp}<li class="${fl?'flagged':''}"><div>${fmtTime(p.in)} to ${p.out?fmtTime(p.out):'<b>now</b>'}<small>${esc(taskLine(p))}${editable&&(p.inLoc||p.outLoc)?` · ${p.inLoc?'in '+locNote(p.inLoc,p.jobId):''}${p.inLoc&&p.outLoc?', ':''}${p.outLoc?'out '+locNote(p.outLoc,p.jobId):''}`:''}${editable&&!p.inLoc&&!p.outLoc?(p.fieldAdded?' · <span class="muted">added later, no location</span>':' · <span class="muted">no location</span>'):''}</small>${p.note?`<small style="color:var(--ink);white-space:pre-wrap">${esc(p.note)}</small>`:''}${fl?`<small class="flag flagnote">Needs review: out ${Math.round(fl.late/60000)} min after the rest of the crew (${fmtTime(fl.others)})</small>`:''}${p.fieldEdited&&!p.reviewed?`<small class="flag flagnote">${p.fieldAdded?'Added by employee':'Time changed by employee'}${p.fieldEdited.wasIn?` (was ${fmtTime(p.fieldEdited.wasIn)} to ${p.fieldEdited.wasOut?fmtTime(p.fieldEdited.wasOut):'open'})`:''}</small>`:''}</div><div class="row"><span class="num">${fh(hrs(punchMs(p)))} h</span>${fl||(editable&&p.fieldEdited&&!p.reviewed)?`<button class="btn small" data-act="markreviewed" data-doc="${esc(p.docId)}" data-id="${esc(p.id)}" data-p="${esc(p.personId)}">Looks right</button>`:''}${editable?`<button class="btn small" data-act="editpunch" data-p="${esc(p.personId)}" data-doc="${esc(p.docId)}" data-id="${esc(p.id)}">Edit</button>`:''}${mine&&p.act==='yard'&&p.sub===COLLECT&&S.jobs[p.jobId]?`<button class="btn small" data-act="editmats" data-j="${esc(p.jobId)}" data-d="${ymd(new Date(p.in))}">Materials</button>`:''}${mine?`<button class="btn small" data-act="editmine" data-id="${esc(p.id)}">Edit</button>`:''}</div></li>`}).join('')}</ul></div>`}).join('');
}

function allChecks(){const out=[];for(const d of Object.values(S.checks)){for(const [id,c] of Object.entries((d&&d.checks)||{}))if(c)out.push({id,docId:d.week,...c})}return out.sort((a,b)=>b.at-a.at)}

function kmIn(eid,from,to){const r=[];allChecks().forEach(c=>{if(c.equipId===eid&&c.meter&&c.date>=from&&c.date<=to)r.push(+c.meter)});allFuel().forEach(x=>{if(x.equipId===eid&&x.meter&&x.date>=from&&x.date<=to)r.push(+x.meter)});return r.length>1?Math.round(Math.max(...r)-Math.min(...r)):0}
function meterInfo(eid){
  const f=fleetDoc(eid);let base=+f.meter||0,at=+f.meterAt||0;
  allChecks().forEach(c=>{if(c.equipId===eid&&c.meter&&c.at>at){at=c.at;base=+c.meter}});
  allFuel().forEach(x=>{if(x.equipId===eid&&x.meter&&x.at>at){at=x.at;base=+x.meter}});
  if(!at)return {est:null,base:0,at:0,run:0};
  if(isKm(eid))return {est:base,base,at,run:0};
  const run=allPunches().filter(p=>p.equipId===eid&&p.act!=='shop'&&p.in>=at).reduce((a,p)=>a+hrs(punchMs(p)),0);
  return {est:base+run,base,at,run};
}
function serviceStatus(eid){
  const f=fleetDoc(eid),iv=+f.interval||0,m=meterInfo(eid);
  if(!iv||m.est==null)return {cls:'Complete',label:'Not set up',next:null,left:null};
  const woSvc=allWOs().filter(w=>w.equipId===eid&&w.status==='Completed'&&w.kind==='Scheduled service'&&w.meter!==''&&w.meter!=null).reduce((a,w)=>Math.max(a,+w.meter),0);
  const next=Math.max(+f.lastService||0,woSvc)+iv,left=next-m.est;

  if(left<=Math.max(isKm(eid)?500:25,iv*0.1))return {cls:'On-hold',label:'Service due soon',next,left};
  return {cls:'Active',label:'OK',next,left};
}
const annualOf=e=>{if(!e)return null;const a=e.annual||null,b=(S.fleet[e.id]||{}).annual||null;if(!a&&!b)return null;if(!b)return a;if(!a)return b;return (+b.at||0)>(+a.at||0)?b:a};
const annualDays=e=>{const a=annualOf(e);return a&&a.has&&a.due?Math.round((fromYmd(a.due)-fromYmd(today()))/86400000):null};

const dailyDocId=(jobId,date)=>`${jobId}_${weekKey(fromYmd(date))}`;

function allDaily(filter){const out=[];for(const d of Object.values(S.daily)){if(!d||!d.days)continue;for(const [date,r] of Object.entries(d.days))if(r&&(!filter||filter(d.jobId,date,r)))out.push({jobId:d.jobId,date,...r})}return out.sort((a,b)=>b.date.localeCompare(a.date)||String(a.jobId).localeCompare(b.jobId))}
function crewOnDay(jobId,date){const g={};allPunches().forEach(p=>{if(p.jobId===jobId&&ymd(new Date(p.in))===date)g[p.personId]=(g[p.personId]||0)+punchMs(p)});return Object.entries(g).map(([pid,ms])=>`${personName(pid)} ${fh(hrs(ms))} h`)}
function dailyAuto(jobId,date){const ps=jobPunches(jobId).filter(p=>pDate(p)===date);const crew={},mach={};ps.forEach(p=>{const h=hrs(punchMs(p));const c=crew[p.personId]=crew[p.personId]||{h:0,t:{}};c.h+=h;const tl=ACTS[p.act]||p.act;c.t[tl]=(c.t[tl]||0)+h;if(p.equipId&&MACH_ACT(p))mach[p.equipId]=(mach[p.equipId]||0)+h});

  return {crew,mach,notes,mats,onsite}}

function missingReportsFor(pid,days){

}

const TYPE_BY_EXT={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',mp4:'video/mp4',webm:'video/webm',csv:'text/csv',txt:'text/plain',md:'text/markdown',json:'application/json'};
const fileType=f=>{const ext=String(f.name).split('.').pop().toLowerCase();return TYPE_BY_EXT[ext]||(Object.values(TYPE_BY_EXT).includes(f.type)?f.type:null)};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function docFiles(jobKey,field){const out=[];const add=(src,crew)=>{Object.entries(((src[jobKey]||{}).files)||{}).forEach(([id,f])=>{if(f)out.push({id,crew,...f})})};add(S.docs,true);if(!field&&can('docs'))add(S.odocs,false);return out.sort((a,b)=>b.at-a.at)}

/* ---------- photos (compressed into the database so field staff can add them) ---------- */
const PHOTO_DOC_MAX=230000;
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('bad image'));i.src=url});
    let edge=1280,q=0.62,out='';
    for(let k=0;k<7;k++){const sc=Math.min(1,edge/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=110000)break;q=Math.max(0.35,q-0.08);edge=Math.round(edge*0.85)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

function payrollData(wkStart,weeks){
  const ot=+cfg().overtimeAfter||44;const rows={};const issues={};const flags=reviewFlags();
  for(let w=0;w<weeks;w++){const wk=addDays(wkStart,7*w);
    Object.keys(S.people).forEach(pid=>{const ps=weekPunches(pid,wk);if(!ps.length)return;let cum=0;
      const r=rows[pid]=rows[pid]||{std:0,land:0,ot:0,gross:0,open:0,flags:0,weeks:{},byTask:{}};
      ps.forEach(p=>{if(!p.out){r.open++;return}if(flags[p.id]||(p.fieldEdited&&!p.reviewed))r.flags++;const h=hrs(punchMs(p));const rate_=wageFor(p);
        const reg=Math.max(0,Math.min(h,ot-cum));const o=h-reg;cum+=h;
        r.byTask[p.act||'labour']=(r.byTask[p.act||'labour']||0)+h;if(p.act==='landscape'&&landRate(pid))r.land+=reg;else r.std+=reg;r.ot+=o;r.gross+=reg*rate_+o*rate_*1.5;r.weeks[wk]=(r.weeks[wk]||0)+h});
    });}
  return rows;
}

FORMS.switchtask=async(fd,f)=>{
  const pid=f.dataset.p,op=openPunch(pid);if(!op){closeModal();return}
  const act=fd.get('act'),equipId=act==='yard'||act==='office'?'':(fd.get('equip')||''),sub=act==='yard'?(fd.get('sub')||'General'):'',jobId=act==='shop'||act==='office'||act==='travel'?'':act==='yard'?(sub===COLLECT&&S.jobs[fd.get('cjob')]?fd.get('cjob'):'loc:yard'):act==='pit'?'loc:'+(fd.get('pit')||'mcclintock'):(act==='drive'&&fd.get('floatEq')?floatBillJob(fd.get('floatEq'),fd.get('floatTo')):(fd.get('job')||'')),note=fd.get('note').trim();
  if(act==='yard'&&sub===COLLECT&&!S.jobs[jobId])return formErr('Pick which job the materials are for.');
  if(act==='operate'&&!equipId)return formErr('Pick the machine.');if(act==='drive'&&!equipId)return formErr('Pick the truck.');
  if(act!=='travel'&&['operate','labour','landscape','survey','drive'].includes(act)&&!jobId&&!(act==='drive'&&fd.get('floatEq')))return formErr('Pick a job or location.');
  if(fd.get('act')==='travel'||(fd.get('act')==='drive'&&fd.get('floatEq')&&!S.jobs[fd.get('floatTo')])){const o=fd;fd={get:k=>k==='extra'||k==='extraNew'?'':o.get(k),getAll:k=>o.getAll(k)}}
  const xr=fd.get('extra')==='__new'?{id:'__pending'}:await resolveExtra(fd,jobId);if(xr.err)return formErr(xr.err);if(fd.get('extra')==='__new'&&!(fd.get('extraNew')||'').trim())return formErr('Describe the new extra work.');let extraId=xr.id==='__pending'?'':xr.id;
  if(fd.get('extra')!=='__new'&&act===op.act&&jobId===(op.jobId||'')&&equipId===(op.equipId||'')&&sub===(op.sub||(act==='yard'?'General':''))&&extraId===(op.extraId||''))return formErr('That\'s what you\'re already on.');
  // Attribute open travel streak before closing/opening new punch
  if(op.act==='travel'||travelStreak(pid).some(travelNeedsAttr)){
    if(act!=='travel'&&isCustomerJob(jobId))await attributeTravelSegments(pid,{type:'toJob',jobId});
    else if(act==='shop'||act==='office'||act==='yard'||act==='pit')await attributeTravelSegments(pid,{type:'shop'});
  }
  const now=Date.now(),wk=weekKey(new Date(now)),newDoc=`${pid}_${wk}`,nid=newId();
  if(fd.get('extra')==='__new'){const r=await resolveExtra(fd,jobId);if(r.err)return formErr(r.err);extraId=r.id}
  const loc=await getLoc();const rec={in:now,out:null,act,jobId,equipId,note:'',inLoc:loc,extraId};if(act==='travel'){rec.jobId='';rec.travelAuto=true}if(act==='yard')rec.sub=sub;if(act==='drive'){const tr=autoTrailer(equipId)||fd.get('trailer')||'';if(tr)rec.trailerId=tr}
  if((act==='operate'||act==='landscape')&&equipId&&jobId&&unitLocation(equipId).loc!==jobId)await put('moves',newId(),{equipId,at:now,to:jobId,by:pid,note:'Clocked in on it here',created:now});if(act==='drive'&&fd.get('floatEq')&&!(needsTrailerForFloat(equipId)&&!fd.get('trailer'))){if(!fd.get('floatTo'))return formErr('Pick where you\'re taking the machine.');if(fd.get('floatEq')===equipId)return formErr('The machine being floated can\'t be the truck you\'re driving.');rec.float=floatOf(fd.get('floatEq'),fd.get('floatTo'))}const close={out:now,note,outLoc:loc};
  let ok;
  if(op.docId===newDoc)ok=await patch('time',newDoc,{punches:{[op.id]:close,[nid]:rec}});
  else{ok=await patch('time',op.docId,{punches:{[op.id]:close}});if(ok)ok=await patch('time',newDoc,{personId:pid,week:wk,punches:{[nid]:rec}})}
  if(ok){closeModal();toast(`Switched to ${taskLine(rec)}`)}
};

const oosReason=eid=>{const o=oosOf(eid);if(o)return o.note||'';const w=allWOs().find(w=>w.equipId===eid&&w.status!=='Completed'&&w.down);return w?`WO-${w.number}: ${w.complaint||''}`:''};

function invCalc(i){const sub=(i.lines||[]).reduce((a,l)=>a+(+l.q||0)*(+l.p||0),0);const t=i.tax==null?+cfg().taxRate:+i.tax;const tax=sub*t/100;return {sub,tax,total:sub+tax,t}}

function billedSources(jobId,skipInv){const ex={punches:new Set(),eqDays:new Set(),tickets:new Set(),moves:new Set(),costs:new Set(),floats:new Set()};
  allInvoices().filter(i=>i.jobId===jobId&&i.id!==skipInv&&i.status!=='Void'&&!i.correctsId).forEach(i=>{

    if(i.from||i.to){const B=jobBilling(jobId,i.from||'',i.to||today());['punches','eqDays','tickets','moves','costs','floats'].forEach(k=>(B.sources[k]||[]).forEach(x=>ex[k].add(x)));(B.sources.floats||[]).forEach(x=>ex.punches.add(x))}});

function billingLines(jobId,from,to,opts){

    Object.entries(B.byExtra).forEach(([xid,x])=>{const nm=extraName(jobId,xid);Object.entries(x.byUnit).forEach(([eid,h])=>lines.push({d:`Extra: ${nm}, ${equipName(eid)}`,q:+h.toFixed(2),u:'hr',p:equipRate(eid)}));Object.entries(x.byPerson).forEach(([pid,h])=>{if(billRate(pid))lines.push({d:`Extra: ${nm}, ${personName(pid)}`,q:+h.toFixed(2),u:'hr',p:billRate(pid)})})});

  let pid=null;if(String(viewAs||'').startsWith('office:'))pid=viewAs.slice(7);else if(!isAdmin)pid=meId;

let SB=null,PROFILE=null,RT=null;
const PATH2KEY=Object.fromEntries(Object.entries(COLS).map(([k,v])=>[v,k]));
function fail(e){const m=(e&&(e.message||e.code))||'';toast(/row-level security|permission|policy|42501/i.test(m)?"Your account can't change that. Ask the admin.":/network|fetch/i.test(m)?"Couldn't save. Check your connection and try again.":`Couldn't save. ${m}`)}
async function put(key,id,data){memoClear();
  if(previewBlock())return false;
  if(mode==='local'){S[key][id]=data;render();return true}
  const prev=S[key][id];S[key][id]=data;render();cacheSave();
  if(OUTBOX.length||!navigator.onLine){if(enqueue({kind:'put',key,docId:id,data}))return true;if(prev===undefined)delete S[key][id];else S[key][id]=prev;render();return false}
  let error;try{({error}=await SB.from('docs').upsert({collection:COLS[key],id,data,updated_by:uid},{onConflict:'collection,id'}))}catch(e){error=e}
  if(error){if(netErr(error)&&enqueue({kind:'put',key,docId:id,data}))return true;if(prev===undefined)delete S[key][id];else S[key][id]=prev;render();fail(error);return false}return true;
}
async function patch(key,id,data){memoClear();
  if(previewBlock())return false;
  if(mode==='local'){S[key][id]=deepMerge(S[key][id],data);render();return true}
  const prev=S[key][id];S[key][id]=deepMerge(S[key][id],data);render();cacheSave();
  if(OUTBOX.length||!navigator.onLine){if(enqueue({kind:'patch',key,docId:id,data}))return true;if(prev===undefined)delete S[key][id];else S[key][id]=prev;render();return false}
  let error;try{({error}=await SB.rpc('patch_doc',{p_collection:COLS[key],p_id:id,p_patch:data}))}catch(e){error=e}
  if(error){if(netErr(error)&&enqueue({kind:'patch',key,docId:id,data}))return true;if(prev===undefined)delete S[key][id];else S[key][id]=prev;render();fail(error);return false}return true;
}
async function remove(key,id){memoClear();
  if(previewBlock())return false;
  if(mode==='local'){delete S[key][id];render();return true}
  const prev=S[key][id];delete S[key][id];render();cacheSave();
  if(OUTBOX.length||!navigator.onLine){if(enqueue({kind:'remove',key,docId:id}))return true;S[key][id]=prev;render();return false}
  let error;try{({error}=await SB.from('docs').delete().match({collection:COLS[key],id}))}catch(e){error=e}
  if(error){if(netErr(error)&&enqueue({kind:'remove',key,docId:id}))return true;S[key][id]=prev;render();fail(error);return false}return true;
}
async function tryClaim(){if(mode==='local'||!SB)return false;try{const {data,error}=await SB.rpc('claim_employee');if(error||!data)return false;meId=data;if(PROFILE)PROFILE.person_id=data;return true}catch(e){return false}}
async function setMe(pid){
  if(mode==='local'){meId=pid;render();return}
  const {error}=await SB.from('profiles').update({person_id:pid}).eq('user_id',uid);
  if(error){fail(error);return}meId=pid;if(PROFILE)PROFILE.person_id=pid;render();
}

  <div class="mactions"><button class="btn left" data-act="rjexport">Download a copy</button><button class="btn" data-act="close">Close</button></div>`}

const netErr=e=>{const m=String((e&&(e.message||e.details||e))||'');return !navigator.onLine||/fetch|network|load failed|timeout|ECONN|offline|NetworkError/i.test(m)};
function enqueue(op){op.id=newId();op.at=Date.now();OUTBOX.push(op);if(!obSave()){OUTBOX.pop();return false}OFFLINE=true;render();return true}
function cacheSave(){memoClear();clearTimeout(CACHE_T);CACHE_T=setTimeout(()=>{try{const photos={};Object.entries(S.photos||{}).forEach(([k,v])=>{photos[k]=v&&v.data&&!v.pending?{...v,data:''}:v});const Sc={...S,photos};if(!isOffice||!customersLoaded)Sc.customers={};localStorage.setItem(CACHE_KEY(),JSON.stringify({at:Date.now(),S:Sc,PROFILE,customersLoaded:!!(isOffice&&customersLoaded)}))}catch(e){}},2500)}
function cacheLoad(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY())||'null');if(c&&c.S){if(c.customersLoaded)customersLoaded=true;return c}return null}catch(e){return null}}
function applyOutboxLocally(){OUTBOX.forEach(op=>{try{if(op.kind==='put')S[op.key][op.docId]=op.data;else if(op.kind==='patch')S[op.key][op.docId]=deepMerge(S[op.key][op.docId],op.data);else if(op.kind==='remove')delete S[op.key][op.docId];else if(op.kind==='photo')S.photos[op.docId]={ref:op.ref,...op.meta,data:op.dataUrl,by:op.by,at:op.at,pending:true}}catch(e){}})}
async function flushOutbox(){if(SYNCING||!OUTBOX.length||mode!=='live'||!SB)return;if(!navigator.onLine)return;SYNCING=true;render();
  while(OUTBOX.length){const op=OUTBOX[0];let res;
    try{
      if(op.kind==='put')res=await SB.from('docs').upsert({collection:COLS[op.key],id:op.docId,data:op.data,updated_by:uid},{onConflict:'collection,id'});
      else if(op.kind==='patch')res=await SB.rpc('patch_doc',{p_collection:COLS[op.key],p_id:op.docId,p_patch:op.data});
      else if(op.kind==='remove')res=await SB.from('docs').delete().match({collection:COLS[op.key],id:op.docId});
      else if(op.kind==='photo'){res=op.uploaded?{error:null}:await SB.storage.from('photos').upload(op.path,dataUrlToBlob(op.dataUrl),{contentType:'image/jpeg',upsert:true});if(!res.error){op.uploaded=true;obSave()}if(!res.error){const meta={ref:op.ref,...op.meta,path:op.path,by:op.by,at:op.at};res=await SB.from('docs').upsert({collection:COLS.photos,id:op.docId,data:meta,updated_by:uid},{onConflict:'collection,id'});if(!res.error)S.photos[op.docId]=meta}}
    }catch(e){res={error:e}}

FORMS.restore=async(fd,f)=>{const say=m=>{const e=f.querySelector('#formerr');if(e)e.textContent=m};const btn=f.querySelector('button');
  try{
    const file=f.querySelector('[name=file]').files[0];if(!file)return say('Choose a backup file.');let obj;try{obj=JSON.parse(await file.text())}catch(e){return say('That is not a valid backup file.')}
    if(mode==='local')return say('Restore only works in the live app, not sample mode.');
    const merge=!!obj.__merge;delete obj.__merge;const rows=[];Object.entries(obj).forEach(([c,docs])=>{if(docs&&typeof docs==='object')Object.entries(docs).forEach(([id,data])=>rows.push({collection:c,id,data,updated_by:uid}))});
    if(!rows.length)return say('Nothing to load in that file.');
    if(btn)btn.disabled=true;let n=0;say(`${merge?'Adding':'Restoring'} ${rows.length} records…`);
    if(merge){RESTORING=true;const B=150;let bulk=true;
      for(let i=0;i<rows.length;i+=B){const chunk=rows.slice(i,i+B);let err=null;
        if(bulk){const {error}=await SB.rpc('patch_docs',{p_rows:chunk.map(r=>({collection:r.collection,id:r.id,data:r.data}))});if(error&&/patch_docs|function|schema cache/i.test(error.message||'')){bulk=false}else err=error}
        if(!bulk){for(const r of chunk){const {error}=await SB.rpc('patch_doc',{p_collection:r.collection,p_id:r.id,p_patch:r.data});if(error){err=error;break}}}
        if(err){RESTORING=false;if(btn)btn.disabled=false;return say(`Stopped after ${n} records: ${err.message}. Run the file again; records already added are kept and just updated.`)}
        n+=chunk.length;say(`Added ${Math.min(n,rows.length)} of ${rows.length}…`)}
      RESTORING=false;toast(`Added ${rows.length} records`);setTimeout(()=>location.reload(),600);return}
    for(let i=0;i<rows.length;i+=200){const {error}=await SB.from('docs').upsert(rows.slice(i,i+200),{onConflict:'collection,id'});if(error){if(btn)btn.disabled=false;return say('Stopped: '+error.message)}n+=Math.min(200,rows.length-i);say(`Restored ${n} of ${rows.length}…`)}
    toast(`Restored ${n} records`);setTimeout(()=>location.reload(),600);
  }catch(e){if(btn)btn.disabled=false;say('Could not restore: '+(e&&e.message||e))}};

const UNIT_BASE={'m':['len',1],'lm':['len',1],'ft':['len',0.3048],'yd':['len',0.9144],'in':['len',0.0254],'m²':['area',1],'sq ft':['area',0.09290304],'sq yd':['area',0.83612736],'acre':['area',4046.8564224],'ha':['area',10000],'m³':['vol',1],'yd³':['vol',0.764554858],'ft³':['vol',0.028316846592],'t':['mass',1],'tonne':['mass',1],'ton':['mass',0.90718474],'kg':['mass',0.001]};
function unitFactor(from,to){from=String(from||'').trim().toLowerCase();to=String(to||'').trim().toLowerCase();if(from===to||!from)return 1;const a=UNIT_BASE[from],b=UNIT_BASE[to];if(a&&b&&a[0]===b[0])return a[1]/b[1];return null}

const fleetTypeRate=t=>{const f=fleetTypes().find(x=>x.type===t);return f?f.price:0};

function codeUnitCalc(c){
  const prod=prodPerHour(c);const o={equipH:0,labH:0,equip:0,lab:0,mat:0,other:0,pEquip:0,pLab:0,pMat:0,pOther:0};

      if(Math.abs(disc)>=5&&!cur.pumpOk)out.push({src,type,prev,cur,moved,disc})}
  });

}
function pumpsTab(){

  let sinceReset=log.findIndex(e=>e.kind==='reset');const upto=sinceReset<0?log:log.slice(0,sinceReset+1);
  const logged=upto.filter(e=>e.kind!=='reset').reduce((a,e)=>a+(+e.litres||0),0);const first=upto[upto.length-1],lastE=upto[0];const moved=first&&lastE?(+lastE.pumpReading)-(+first.pumpReading):0;
  const rows=[];const asc=log.slice().reverse();for(let i=0;i<asc.length;i++){const e=asc[i],prev=asc[i-1];const mv=prev&&e.kind!=='reset'?(+e.pumpReading)-(+prev.pumpReading):null;const d=mv==null?null:mv-(+e.litres||0);rows.push({e,mv,d})}

function empStats(pid,pf,pt){

  const r={hours:0,jobH:0,billH:0,billed:0,value:0,cost:0,machine:0,byTask:{},byJob:{},days:new Set(),extras:0,pendH:0,pendCost:0,pendJobs:new Set()};
  const qf={};
  ps.forEach(p=>{const h=hrs(punchMs(p));const c=empCost(p);r.days.add(ymd(new Date(p.in)));r.byTask[p.act||'labour']=(r.byTask[p.act||'labour']||0)+h;
    const isJob=p.jobId&&S.jobs[p.jobId];const isCollect=p.act==='yard'&&p.sub===COLLECT&&isJob;const q=isJob&&isQuoted(p.jobId);
    const pending=q&&!p.extraId&&S.jobs[p.jobId].status!=='Complete';
    if(pending){r.pendH+=h;r.pendCost+=c;r.pendJobs.add(p.jobId);const j=r.byJob[p.jobId]=r.byJob[p.jobId]||{h:0,billed:0,cost:0,pending:true};j.h+=h;j.cost+=c;return}
    const cm=opCostInMachine(p);r.hours+=h;r.cost+=cm?h*equipCostAt(p.equipId,pDate(p)):c;
    if(isJob&&(!NONBILL.has(p.act)||isCollect)){r.jobH+=h;const cov=opCovered(p);const v=cov?h*equipRateAt(p.equipId,pDate(p)):h*punchBillRate(p,pDate(p));r.value+=v;let earned=v;
      if(q&&!p.extraId){if(qf[p.jobId]==null)qf[p.jobId]=quoteFactor(p.jobId);earned=v*qf[p.jobId]}
      if(q&&p.extraId)r.extras+=v;r.billH+=h;r.billed+=earned;
      if(p.equipId&&(p.act==='operate'||p.act==='drive'||p.act==='landscape'))r.machine+=h*equipRateAt(p.equipId,pDate(p));
      const j=r.byJob[p.jobId]=r.byJob[p.jobId]||{h:0,billed:0,cost:0};j.h+=h;j.billed+=earned;j.cost+=cm?h*equipCostAt(p.equipId,pDate(p)):c;if(q&&!p.extraId)j.share=qf[p.jobId]}
  });
  r.profit=r.billed-r.cost;r.tmProfit=r.value-r.cost;r.dayCount=r.days.size;r.allH=r.hours+r.pendH;return r;
}
function jobPeriodProfit(jid,pf,pt){
  const B=jobBilling(jid,pf,pt);const cost=B.equipCostTotal+B.matCostTotal+B.stockCost+B.labourCost+B.otherCost;
  if(!B.quoted){const billed=jobBilled(B);return {billed,cost,profit:billed-cost,active:billed>0.005||cost>0.005}}
  const j=S.jobs[jid]||{};const active=B.tmTotal>0.005||cost>0.005;
  if(j.status!=='Complete')return {pending:true,cost,billed:0,profit:0,active,tm:B.tmTotal};
  const earned=(B.tmTotal-B.exTotal)*quoteFactor(jid)+B.exTotal;return {billed:earned,cost,profit:earned-cost,active}
}
function managedStats(pid,pf,pt){const r={jobs:[],billed:0,cost:0,profit:0,pending:0};
  jobsArr().filter(j=>mgrsOf(j).includes(pid)).forEach(j=>{const x0=jobPeriodProfit(j.id,pf,pt);if(!x0.active)return;const n=mgrsOf(j).length||1;const x={...x0,billed:x0.billed/n,cost:x0.cost/n,profit:x0.profit/n,share:n>1?n:0};r.jobs.push({j,...x});if(x.pending){r.pending++;return}r.billed+=x.billed;r.cost+=x.cost;r.profit+=x.profit});return r}

const dayStartMs=d=>{const [h,m]=String(cfg().dayStart||'07:00').split(':').map(Number);const x=fromYmd(d);x.setHours(h||0,m||0,0,0);return +x};

const FLOAT_TRUCKS=new Set(['Tri/float','Float truck','Pickup & trailer','550 with trailer','550','Pickup']);
function floatEvents(eid){if(isGeneric(eid))return [];const mk='fe|'+eid;if(MEMO.has(mk))return MEMO.get(mk);const r=floatEventsRaw(eid);MEMO.set(mk,r);return r}
function floatEventsRaw(eid){const ev=[];
  allPunches().forEach(p=>{if(p.float&&p.float.equipId===eid){ev.push({at:p.in,type:'leave',by:p.personId,truck:p.equipId,open:!p.out,to:p.float.to});if(p.out)ev.push({at:p.out,type:'arrive',to:p.float.to,by:p.personId,truck:p.equipId})}});
  Object.values(S.moves||{}).forEach(m=>{if(m&&m.equipId===eid&&!m.deleted)ev.push({at:+m.at,type:'arrive',to:m.to,by:m.by,manual:true,note:m.note||''})});
  if(!isTruck(eid))allPunches().forEach(p=>{if(p.equipId===eid&&(p.act==='operate'||p.act==='landscape'||p.act==='pit')&&p.jobId&&!ev.some(x=>x.manual&&Math.abs(x.at-p.in)<120000&&x.to===p.jobId))ev.push({at:p.in,type:'arrive',to:p.jobId,by:p.personId,ran:true})});
  return ev.sort((a,b)=>a.at-b.at)}
function truckEvents(eid){const mk='te|'+eid;if(MEMO.has(mk))return MEMO.get(mk);const r=truckEventsRaw(eid);MEMO.set(mk,r);return r}
function truckEventsRaw(eid){const isTr=(S.equip[eid]||{}).type==='Trailer';if(!isTruck(eid)&&!isTr)return [];const ev=[];allPunches().forEach(p=>{if((isTr?p.trailerId!==eid:p.equipId!==eid)||(p.act!=='drive'&&p.act!=='travel')||!p.jobId)return;ev.push({at:p.in,type:'leave',to:p.jobId,by:p.personId,truck:eid,drive:true});if(p.out)ev.push({at:p.out,type:'arrive',to:p.jobId,by:p.personId,truck:eid,drive:true})});return ev}
function unitLocation(eid,at,billing){let loc='',transit=false,since=0,to='';if(isGeneric(eid))return {loc:'rental',transit:false,since:0,to:''};(billing?floatEvents(eid):[...floatEvents(eid),...truckEvents(eid)].sort((a,b)=>a.at-b.at)).forEach(e=>{if(e.at>(at||Date.now()))return;if(e.type==='arrive'){loc=e.to;transit=false;since=e.at}else{transit=true;since=e.at;to=e.to}});return {loc:transit?'transit':loc,transit,since,to}}

function siteSegments(eid,jobId,date){const ev=floatEvents(eid);if(!ev.length)return undefined;const ds=dayStartMs(date),de=ds+WD()*3600000;

  if(cur!=null)segs.push([cur,de]);return segs}

function approvedPeriods(){return Object.entries(S.payroll||{}).map(([k,v])=>{if(!v||v.status==='reopened')return null;const start=v.start||k.split('_')[0];const weeks=+(v.weeks||k.split('_')[1]||1);return {key:k,start,weeks,end:addDays(start,7*weeks-1),v}}).filter(Boolean)}
const weekLocked=wk=>approvedPeriods().find(p=>wk>=p.start&&wk<=p.end)||null;

/* ---------- charge engine: every billable component has a stable key; invoices allocate quantities and amounts to keys ---------- */
// job-sheet adjustments: change hours or leave out an entry for this job's billing and costs only (timesheets and pay untouched)
const jobAdj=jobId=>((S.jobfin[jobId]||{}).adj)||{};
function adjPunch(p){const a=jobAdj(p.jobId)[p.id];if(!a)return p;if(a.exclude)return null;if(a.h!=null&&a.h!==''){const out=p.in+(+a.h)*3600000;return {...p,out,adjusted:true,origOut:p.out}}return p}
const matAdj=jobId=>((S.jobfin[jobId]||{}).madj)||{};
function adjTicket(t){const a=matAdj(t.jobId)[t.id];if(!a)return t;if(a.exclude)return null;const o={...t,adjusted:true};if(a.q!=null&&a.q!=='')o.t=+a.q;if(a.price!=null&&a.price!=='')o.price=+a.price;return o}
function adjMove(m){const a=matAdj(m.jobId)[m.id];if(!a)return m;if(a.exclude)return null;const o={...m,adjusted:true};if(a.q!=null&&a.q!=='')o.qty=+a.q;if(a.price!=null&&a.price!=='')o.jprice=+a.price;return o}
const jobTickets=jobId=>allTickets().filter(t=>t.mode==='own'&&t.jobId===jobId&&!t.void).map(adjTicket).filter(Boolean);
const jobMoves=jobId=>allMoves().filter(m=>m.jobId===jobId&&(m.type==='out'||m.type==='return')).map(adjMove).filter(Boolean);
const movePrice=m=>m.jprice!=null?m.jprice:(m.itemId?itemPrice(m.itemId):(+m.price||0));
const jobPunches=jobId=>allPunches().filter(p=>p.jobId===jobId).map(adjPunch).filter(Boolean);
const SITE_ACTS=new Set(['operate','labour','landscape','survey']);
const workedOnSite=p=>!!p&&!!S.jobs[p.jobId]&&SITE_ACTS.has(p.act);
const MACH_ACT=p=>p.equipId&&(p.act==='operate'||p.act==='drive'||p.act==='landscape');
function mergedMs(list){list.sort((a,b)=>a[0]-b[0]);let tot=0,cs=null,ce=null;list.forEach(([a,b])=>{if(cs==null){cs=a;ce=b}else if(a<=ce){if(b>ce)ce=b}else{tot+=ce-cs;cs=a;ce=b}});if(cs!=null)tot+=ce-cs;return tot}
// quoted-job extras, priced exactly like hourly billing (effective rates, operator included, merged machine time, daily units)
function extraCharges(jobId,from,to){const inR=d=>(!from||d>=from)&&(!to||d<=to);const opInc=opIncludedFor(jobId);const out=[];
  const ps=jobPunches(jobId).filter(p=>p.extraId&&inR(pDate(p)));const iv={};
  ps.forEach(p=>{const d=pDate(p),h=hrs(punchMs(p));const nm=extraName(jobId,p.extraId);
    if(!(opInc&&MACH_ACT(p))){const br=punchBillRate(p,d);const k=`X|${p.extraId}|L|${p.personId}|${d}`;const c=out.find(x=>x.key===k);if(c){c.q+=h;c.amt+=h*br}else out.push({key:k,cat:'labour',date:d,extraId:p.extraId,group:`Extra: ${nm}, ${personName(p.personId)}`,u:'hr',q:h,amt:h*br,personId:p.personId})}
    if(MACH_ACT(p)){const k=p.extraId+'|'+p.equipId+'|'+d;(iv[k]=iv[k]||[]).push([p.in,p.out||Date.now()])}});
  Object.entries(iv).forEach(([k,list])=>{const [xid,eid,d]=k.split('|');const nm=extraName(jobId,xid);const h=hrs(mergedMs(list));
    if(equipBasis(eid)==='day')out.push({key:`X|${xid}|E|${eid}|${d}|day`,cat:'equip',date:d,extraId:xid,group:`Extra: ${nm}, ${equipName(eid)}`,u:'day',q:1,amt:equipRateAt(eid,d),eid});
    else out.push({key:`X|${xid}|E|${eid}|${d}|run`,cat:'equip',date:d,extraId:xid,group:`Extra: ${nm}, ${equipName(eid)}`,u:'hr',q:h,amt:h*equipRateAt(eid,d),eid})});
  jobCosts(jobId,from,to).filter(c=>c.billable!==false&&c.extraId&&c.status!=='Committed').forEach(c=>out.push({key:'C|'+c.id,cat:'other',date:c.date,extraId:c.extraId,group:`Extra: ${extraName(jobId,c.extraId)}, ${c.vendor}, ${c.desc}`,u:'ls',q:1,amt:costSell(c),solo:true}));
  return out}
function jobCharges(jobId,to){const j=S.jobs[jobId]||{};const out=[];if(isQuoted(jobId))return extraCharges(jobId,'',to);
  const B=jobBilling(jobId,'',to||'');
  B.days.forEach(d=>d.units.forEach(u=>{const n=equipName(u.eid);
    if(u.perDay){if(u.dayCharged)out.push({key:`E|${u.eid}|${d.date}|day`,cat:'equip',date:d.date,group:n,u:'day',q:1,amt:u.runAmt,eid:u.eid});return}
    if(u.runH>0.0001)out.push({key:`E|${u.eid}|${d.date}|run`,cat:'equip',date:d.date,group:`${n}, running`,u:'hr',q:u.runH,amt:u.runAmt,eid:u.eid});
    if(u.sbH>0.0001)out.push({key:`E|${u.eid}|${d.date}|sb`,cat:'equip',date:d.date,group:`${n}, standby`,u:'hr',q:u.sbH,amt:u.sbAmt,eid:u.eid});
    if(u.minAdd>0.005)out.push({key:`E|${u.eid}|${d.date}|min`,cat:'equip',date:d.date,group:`${n}, minimum charge top-up`,u:'ls',q:1,amt:u.minAdd,eid:u.eid})}));
  (B.trailerFloats||[]).forEach(t=>out.push({key:'TF|'+t.id,cat:'equip',date:t.date,group:`Trailer ${equipName(t.trailer)}, float`,u:'float',q:1,amt:t.amt}));
  B.floats.filter(f=>f.top>0.005).forEach(f=>out.push({key:'F|'+f.id,cat:'equip',date:f.date,group:`Float ${equipName(f.machine)} ${f.to===jobId?'to site':'off site'} on ${equipName(f.truck)}, ${fmtDay(f.date)} (minimum ${money(f.min)})`,u:'ls',q:1,amt:f.top,solo:true}));
  const opInc=opIncludedFor(jobId);const lab={};jobPunches(jobId).filter(p=>(!to||pDate(p)<=to)).forEach(p=>{if(opInc&&MACH_ACT(p))return;const d=pDate(p),h=hrs(punchMs(p)),br=punchBillRate(p,d);if(!br)return;const sv=p.act==='survey';const k=`L|${p.personId}|${d}${sv?'|sv':''}`;const c=lab[k]=lab[k]||{key:k,cat:'labour',date:d,group:sv?`Surveying, ${personName(p.personId)}`:`Labour, ${personName(p.personId)}${S.people[p.personId]&&S.people[p.personId].trade?' ('+S.people[p.personId].trade+')':''}`,u:'hr',q:0,amt:0,personId:p.personId};c.q+=h;c.amt+=h*br});out.push(...Object.values(lab));
  jobTickets(jobId).filter(t=>(!to||t.date<=to)).forEach(t=>out.push({key:'T|'+t.id,cat:'mat',date:t.date,group:`${matName(t.mat)}, from our pit`,u:matUnit(t.mat),q:+t.t||0,amt:ticketAmt(t),loads:1}));
  jobMoves(jobId).filter(m=>(!to||m.date<=to)).forEach(m=>{const sg=m.type==='out'?1:-1;const q=sg*(+m.qty||0);const price=movePrice(m);out.push({key:'M|'+m.id,cat:'stock',date:m.date,group:m.itemId?itemName(m.itemId):(m.desc||'Custom item'),u:m.itemId?((stockCat()[m.itemId]||{}).unit||'ea'):(m.unit||'ea'),q,amt:q*price})});
  jobCosts(jobId,'',to).filter(c=>c.billable!==false&&!c.extraId&&c.status!=='Committed').forEach(c=>out.push({key:'C|'+c.id,cat:'other',date:c.date,group:`${c.kind||'Outside cost'}: ${c.vendor}, ${c.desc}${c.ref?' (#'+c.ref+')':''}`,u:'ls',q:1,amt:costSell(c),solo:true}));
  return out}
// what invoices have already taken, by key
function billedAlloc(jobId,skipInv){const a={};const add=(k,q,amt)=>{const x=a[k]=a[k]||{q:0,amt:0};x.q+=q;x.amt+=amt};
  allInvoices().filter(i=>i.jobId===jobId&&i.id!==skipInv&&i.status!=='Void').forEach(i=>{
    const hasAlloc=i.alloc2||(i.lines||[]).some(l=>l.alloc);
    if(hasAlloc){(i.lines||[]).forEach(l=>{if(!l.alloc)return;const f=l.q0?(+l.q||0)/(+l.q0):1;Object.entries(l.alloc).forEach(([k,v])=>add(k,(+v.q||0)*f,(+v.amt||0)*f))});return}
    if(i.correctsId)return;
    // invoices from before allocation: everything they covered by date, or by the sources they recorded
    const src=i.sources||null;const inR=d=>(!i.from||d>=i.from)&&(!i.to||d<=i.to);
    jobCharges(jobId,i.to||'').forEach(c=>{const id=c.key.slice(2);const covered=src?(c.key[0]==='T'?(src.tickets||[]).includes(id):c.key[0]==='M'?(src.moves||[]).includes(id):c.key[0]==='C'?(src.costs||[]).includes(id):c.key[0]==='F'?(src.floats||[]).includes(id):inR(c.date)):inR(c.date);if(covered)add(c.key,c.q,c.amt)})});
  return a}
function unbilledCharges(jobId,to){const al=billedAlloc(jobId);return jobCharges(jobId,to).map(c=>{const b=al[c.key]||{q:0,amt:0};const rq=c.q-b.q,ra=c.amt-b.amt;if(Math.abs(ra)<0.005&&Math.abs(rq)<0.0001)return null;if(ra<0.005&&c.amt>=0)return null;return {...c,q:Math.abs(rq)<0.0001?(c.u==='ls'||c.u==='day'?1:0):rq,amt:ra}}).filter(Boolean)}
function chargeLines(charges,opts){opts=opts||{};const ok=c=>(c.cat==='equip'&&opts.equip!==false)||(c.cat==='labour'&&opts.labour!==false)||(c.cat==='mat'&&opts.mat!==false)||(c.cat==='stock'&&opts.stock!==false)||(c.cat==='other'&&opts.other!==false);
  const g={};charges.filter(ok).forEach(c=>{const k=c.solo?c.key:c.group+'|'+c.u;const L=g[k]=g[k]||{d:c.group,u:c.u,q:0,amt:0,alloc:{},loads:0};L.q+=c.q;L.amt+=c.amt;L.loads+=c.loads||0;L.alloc[c.key]={q:rnd4(c.q),amt:rnd2(c.amt)}});
  return Object.values(g).filter(L=>Math.abs(L.amt)>0.005).map(L=>{const q=Math.abs(L.q)<0.0001?1:rnd2(L.q);const d=L.loads?`${L.d.replace(', from our pit','')}, ${L.loads} load${L.loads>1?'s':''} from our pit`:L.d;return {d,q,u:Math.abs(L.q)<0.0001?'ls':L.u,p:rnd2(L.amt/q),q0:q,alloc:L.alloc}})}
const rnd4=x=>Math.round(x*10000)/10000;
function unbilledSummary(jobId){const mk='ub|'+jobId;if(MEMO.has(mk))return MEMO.get(mk);const r=unbilledSummaryRaw(jobId);MEMO.set(mk,r);return r}
function unbilledSummaryRaw(jobId){const ch=unbilledCharges(jobId);const s={amt:0,crewH:0,machH:0,tickets:0,moves:0,costs:0,charges:ch};ch.forEach(c=>{s.amt+=c.amt;if(c.cat==='labour')s.crewH+=c.q;if(c.cat==='equip'&&c.u==='hr')s.machH+=c.q;if(c.cat==='mat')s.tickets++;if(c.cat==='stock')s.moves++;if(c.cat==='other')s.costs++});return s}

  <div class="lbl" style="margin:12px 0 6px">People</div>${Object.keys(ppl).length?`<div class="tablewrap"><table><thead><tr><th>Person</th><th>Doing</th><th class="num">Hours</th><th class="num">Our cost</th><th class="num">At billing rate</th></tr></thead><tbody>${Object.entries(ppl).sort((a,b)=>b[1].h-a[1].h).map(([pid,r])=>`<tr class="link" data-act="plog" data-j="${esc(jobId)}" data-p="${esc(pid)}"><td><b>${esc(personName(pid))}</b></td><td><small>${esc(Object.entries(r.tasks).map(([t,h])=>`${t} ${fh(rnd2(h))} h`).join(', '))}</small></td><td class="num">${fh(rnd2(r.h))}</td><td class="num">${money(r.cost)}</td><td class="num">${r.bill?money(r.bill):'<span class="muted">in machine rate</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No crew time on this job.</p>'}
  <div class="lbl" style="margin:12px 0 6px">Materials</div>${(()=>{const tix=allTickets().filter(t=>t.mode==='own'&&t.jobId===jobId&&!t.void).sort((a,b)=>a.at-b.at);const mv=allMoves().filter(m=>m.jobId===jobId&&(m.type==='out'||m.type==='return')).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const ma=matAdj(jobId);const canAdj=!asField()&&can('jobs');
    const row=(id,date,name,qRaw,unit,priceRaw,kind)=>{const a=ma[id];const q=a&&a.q!=null&&a.q!==''?+a.q:qRaw;const pr=a&&a.price!=null&&a.price!==''?+a.price:priceRaw;return `<tr${a?' class="flagrow"':''}><td>${fmtDay(date)}<small>${kind}</small></td><td>${esc(name)}${a?`<small>${a.exclude?'Left out of this job':`Job sheet: ${fh(q)} ${esc(unit)} at ${money(pr)}${(a.q!=null&&a.q!=='')?` (record ${fh(qRaw)})`:''}`}${a.note?' · '+esc(a.note):''}</small>`:''}</td><td class="num">${a&&a.exclude?'<s>':''}${fh(rnd2(q))} ${esc(unit)}${a&&a.exclude?'</s>':''}</td><td class="num">${a&&a.exclude?'—':money(q*pr)}</td><td>${canAdj?`<button class="btn small" data-act="madj" data-j="${esc(jobId)}" data-id="${esc(id)}">${a?'Change':'Adjust'}</button>`:''}</td></tr>`};
    const rows=[...tix.map(t=>row(t.id,t.date,matName(t.mat),+t.t||0,matUnit(t.mat),t.price!=null&&t.price!==''?+t.price:matPriceAt(t.mat,t.loc||'mcclintock'),`Pit ticket #${esc(t.no)}`)),...mv.map(m=>{const sg=m.type==='out'?1:-1;return row(m.id,m.date,m.itemId?itemName(m.itemId):(m.desc||'Custom item'),sg*(+m.qty||0),m.itemId?((stockCat()[m.itemId]||{}).unit||'ea'):(m.unit||'ea'),m.itemId?itemPrice(m.itemId):(+m.price||0),m.type==='out'?'From the yard':'Returned to yard')})];
    return rows.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Material</th><th class="num">Qty</th><th class="num">At billing rate</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="empty">No materials on this job.</p>'})()}
  </section>`}

function jobLogModal(jobId,filter,title){const raw=allPunches().filter(p=>p.jobId===jobId&&filter(p)).sort((a,b)=>a.in-b.in);const adj=jobAdj(jobId);const canAdj=!asField()&&can('jobs');

const dayRec=(jobId,date)=>dailyReport(jobId,date)||null;
const dayClosed=(jobId,date)=>{const r=dayRec(jobId,date);return r&&r.closed&&r.closed.at?r.closed:null};
const isSiteMgr=jobId=>!!myId()&&mgrsOf(jobId).includes(myId());
const canCloseDay=jobId=>!asField()||isSiteMgr(jobId);
const canEditDay=jobId=>!asField()||isForeman(myId())||isSiteMgr(jobId);
const tHM=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const atHM=(date,hm)=>{const [h,m]=String(hm).split(':').map(Number);const d=fromYmd(date);d.setHours(h||0,m||0,0,0);return +d};
const pEdited=p=>Math.max(+((p.fieldEdited||{}).at)||0,+((p.foremanEdit||{}).at)||0,+((p.officeEdit||{}).at)||0);
// entries changed after their job-day was closed
function afterCloseEdits(){const out=[];allPunches().forEach(p=>{if(!S.jobs[p.jobId])return;const c=dayClosed(p.jobId,pDate(p));if(!c)return;const e=pEdited(p);if((e>c.at||p.in>c.at)&&!(p.reviewedAfterClose>=e))out.push({p,c})});return out}
// job-days with time but not closed
function unclosedDays(from,to,jobId){const seen=new Set(),out=[];allPunches().forEach(p=>{if(!workedOnSite(p))return;if(jobId&&p.jobId!==jobId)return;const d=pDate(p);if((from&&d<from)||(to&&d>to)||d>=today())return;const k=p.jobId+'|'+d;if(seen.has(k))return;seen.add(k);if(!dayClosed(p.jobId,d))out.push([p.jobId,d])});return out.sort((a,b)=>a[1].localeCompare(b[1]))}
function overlapsFor(personId,id,a,b){return allPunches().filter(x=>x.personId===personId&&x.id!==id&&x.in<b&&(x.out||Date.now())>a)}
